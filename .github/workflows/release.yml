name: xdstorage release

# E-4: tag push v* → JMH smoke → version sanity → signed build + NON-STRESS test suite +
# deploy (Maven Central via the Central Portal) → GitHub Release with the CHANGELOG section.
# The release profile excludes the stress families (*StressTest + the Xml multithread stress,
# docs/FLAKY.md) and the integration package — they are the nightly's and the RC protocol's
# job (docs/RELEASE-PLAN.md § Quality bar), run there ×3 BEFORE the tag is cut. Tests and
# deploy share one Maven invocation: the deploy phase cannot run unless the test phase passed.
# Required secrets (see docs/RELEASE-PLAN.md §1):
#   CENTRAL_USERNAME / CENTRAL_PASSWORD — Central Portal user token (server id "central")
#   GPG_PRIVATE_KEY — armored signing key (export -a --export-secret-keys)
#   GPG_PASSPHRASE  — that key's passphrase
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # dev/test runtime; library bytecode stays release=8
          cache: maven

      - name: JMH smoke with table-row assertion (JMH silently SKIPS failed trials — the row count is the check)
        run: |
          mvn test-compile > /dev/null 2>&1
          CP="target/test-classes:target/classes:$(mvn -q dependency:build-classpath -Dmdep.outputFile=/dev/stdout -Dmdep.includeScope=test)"
          java -cp "$CP" io.github.xdstorage.performance.XdStorageSearchEngineBenchmark quick > /tmp/jmh-smoke.log 2>&1 || { tail -50 /tmp/jmh-smoke.log; exit 1; }
          ROWS=$(grep -c "^XdStorageSearchEngineBenchmark\." /tmp/jmh-smoke.log || true)
          echo "JMH table rows: $ROWS"
          if [ "$ROWS" -lt 9 ]; then echo "EXPECTED 9 benchmark rows, got $ROWS — refusing to release"; exit 1; fi

      - name: Version sanity (pom version must equal the tag)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=$TAG pom=$POM_VERSION"
          if [ "$TAG" != "$POM_VERSION" ]; then
            echo "TAG $TAG != POM VERSION $POM_VERSION — bump the pom (and CHANGELOG) before tagging"; exit 1;
          fi

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > /tmp/signing-key.asc 2>/dev/null || printf '%s' "$GPG_PRIVATE_KEY" > /tmp/signing-key.asc
          gpg --batch --import /tmp/signing-key.asc
          rm -f /tmp/signing-key.asc
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Write Central Portal credentials (server id "central")
        run: |
          mkdir -p ${HOME}/.m2
          cat > ${HOME}/.m2/settings.xml <<SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      # One Maven invocation: build → NON-STRESS suite (release profile excludes
      # *StressTest + XmlDataStorageMultithreadsTest) → sign → deploy. The BUILD SUCCESS
      # verdict comes from Maven's own line — never from a piped grep's exit code (R-52).
      - name: Build, test (non-stress), sign and deploy
        run: |
          set -o pipefail
          if mvn clean deploy -Prelease -Dgpg.passphrase="$GPG_PASSPHRASE" > /tmp/mvn-release.log 2>&1; then
            MAVEN_OK=1
          else
            MAVEN_OK=0
          fi
          grep -E "BUILD (SUCCESS|FAILURE)" /tmp/mvn-release.log
          grep -E "Tests run: [0-9]+, Failures" /tmp/mvn-release.log | tail -1
          if [ "$MAVEN_OK" -ne 1 ]; then echo "release build failed — see archived logs"; tail -100 /tmp/mvn-release.log; exit 1; fi
          grep -q "BUILD SUCCESS" /tmp/mvn-release.log || { echo "BUILD FAILURE detected"; exit 1; }
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VERSION]" 'index($0, hdr)==1 {flag=1; next} /^## \[/ && flag {exit} flag' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section — curate release notes before tagging"; exit 1;
          fi
          head -50 /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: |
            target/xdstorage-*.jar
          fail_on_unmatched_files: true

      - name: Archive release logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            /tmp/mvn-release.log
            /tmp/jmh-smoke.log
          if-no-files-found: ignore
